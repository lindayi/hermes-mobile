name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Expose repository Node dependencies to legacy test imports
        shell: bash
        run: |
          printf 'NODE_PATH=%s/node_modules\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install Chromium in private runner cache
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers"
          export PLAYWRIGHT_SKIP_BROWSER_GC=1
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\nPLAYWRIGHT_SKIP_BROWSER_GC=1\n' \
            "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          ./node_modules/.bin/playwright install --with-deps chromium
          HERMES_BROWSER="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$HERMES_BROWSER"
          printf 'HERMES_TEST_PYTHON=%s/.venv/bin/python\nHERMES_TEST_NODE=%s\nHERMES_BROWSER=%s\n' \
            "$GITHUB_WORKSPACE" "$(command -v node)" "$HERMES_BROWSER" >> "$GITHUB_ENV"
