name: Issue-first policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Open pull request number
        required: true
        type: string
      head_sha:
        description: Expected current pull head SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: issue-link-${{ github.event.pull_request.number || github.event.inputs.pull_number }}
  cancel-in-progress: false
jobs:
  issue-link:
    name: Validate issue metadata
    permissions:
      checks: write
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: issue-link
        name: Publish exact-head issue-link check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          # Never checks out or runs pull-request code; reads metadata only.
          script: |
            const SHA = /^[0-9a-f]{40}$/;
            let number, head;
            if (context.eventName === 'pull_request_target') {
              number = context.payload.pull_request?.number;
              head = context.payload.pull_request?.head?.sha;
            } else if (context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main') {
              const raw = context.payload.inputs?.pull_number;
              number = /^[1-9]\d{0,9}$/.test(raw || '') ? Number(raw) : null;
              head = context.payload.inputs?.head_sha;
            }
            if (!Number.isSafeInteger(number) || !SHA.test(head || '')) {
              throw new Error('Unsupported trigger or invalid pull number/head SHA.');
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: check} = await github.rest.checks.create({
              ...context.repo, name: 'issue-link', head_sha: head, status: 'in_progress',
              details_url: runUrl,
              output: {title: 'Validating issue linkage', summary: 'Checking canonical closing-issue references.'},
            });
            let conclusion = 'failure';
            let summary;
            try {
              const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: number});
              if (pull.state !== 'open' || pull.head.sha !== head || pull.base.ref !== 'main') {
                throw new Error('Pull request is closed, changed head, or does not target main.');
              }
              const data = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      headRefOid
                      closingIssuesReferences(first: 100) {
                        nodes { number state repository { nameWithOwner } }
                      }
                    }
                  }
                }`, {...context.repo, number});
              const pr = data?.repository?.pullRequest;
              if (pr?.headRefOid !== head) throw new Error('Pull request head changed during validation.');
              const repo = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
              const open = (pr.closingIssuesReferences?.nodes || []).filter(issue =>
                issue?.state === 'OPEN' && issue.repository?.nameWithOwner?.toLowerCase() === repo);
              if (!open.length) {
                throw new Error('Link at least one open issue through GitHub canonical issue references (for example "Closes #N").');
              }
              conclusion = 'success';
              summary = `Linked open issues: ${open.map(issue => '#' + issue.number).join(', ')}.`;
            } catch (error) {
              summary = error.message;
            }
            await github.rest.checks.update({
              ...context.repo, check_run_id: check.id, status: 'completed', conclusion,
              completed_at: new Date().toISOString(),
              output: {title: conclusion === 'success' ? 'Issue linked' : 'Issue link missing', summary},
            });
            // Keep the legacy same-name commit status in sync so older heads unblock.
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head, context: 'issue-link', target_url: runUrl,
              state: conclusion, description: summary.slice(0, 140),
            });
            if (conclusion !== 'success') core.setFailed(summary);
