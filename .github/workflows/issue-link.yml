name: Issue-first policy
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: issue-link-${{ github.event.pull_request.number }}
  # Let publication finish; queued edits are revalidated before a success is sent.
  cancel-in-progress: false
jobs:
  issue-link-pending:
    name: Invalidate previous issue result
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: 'issue-link', state: 'pending',
              description: 'Validating issue-closing metadata.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  issue-link:
    name: Validate issue metadata
    needs: issue-link-pending
    permissions:
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.base.ref !== context.payload.repository.default_branch) {
              core.setFailed('Delivery PRs must target the default branch for automatic issue closure.');
              return;
            }
            // Replace excluded examples with a non-whitespace barrier: deleting them
            // could manufacture a closing phrase from text on either side.
            let fence = null;
            let inComment = false;
            const body = (pr.body || '').split(/\r?\n/).map(line => {
                if (fence) {
                  const closing = line.match(/^ {0,3}(`{3,}|~{3,})[ \t]*$/);
                  if (closing && closing[1][0] === fence[0] &&
                      closing[1].length >= fence.length) fence = null;
                  return '\0';
                }
                if (/^(?: {4}| {0,3}\t|\s*>)/.test(line)) return '\0';
                // Comments inside a fence are literal code, not Markdown comments.
                if (inComment) {
                  const end = line.indexOf('-->');
                  if (end < 0) return '\0';
                  inComment = false;
                  line = '\0' + line.slice(end + 3);
                }
                line = line.replace(/<!--.*?(?:-->|$)/g, comment => {
                  inComment = !comment.endsWith('-->');
                  return '\0';
                });
                const marker = line.match(/^ {0,3}(?:(?:[-+*]|\d+[.)])[ \t]+)?(`{3,}|~{3,})(.*)$/);
                // Backtick fence info cannot contain a backtick (it may be an inline span).
                if (marker && (marker[1][0] === '~' || !marker[2].includes('`'))) {
                  fence = marker[1];
                  return '\0';
                }
                return line;
              }).join('\n')
              .replace(/(?<!`)(`+)(?!`)[\s\S]*?(?<!`)\1(?!`)/g, '\0');
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+(?:([\w.-]+\/[\w.-]+))?#([1-9]\d*)\b/gi)];
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const ids = [...new Set(refs.filter(m => !m[1] || m[1].toLowerCase() === repository)
              .map(m => Number(m[2])))];
            if (!ids.length || ids.length > 10 || ids.some(id => !Number.isSafeInteger(id))) {
              core.setFailed('Link an actionable issue with Closes #NUMBER in the PR description (maximum ten).');
              return;
            }
            for (const issue_number of ids) {
              const {data: issue} = await github.rest.issues.get({...context.repo, issue_number});
              if (issue.pull_request || issue.state !== 'open') {
                core.setFailed(`Closing reference #${issue_number} must name an open issue, not a PR.`);
                return;
              }
            }
            core.info(`Validated ${ids.length} closing issue reference(s). Merge is not deployment.`);
  issue-link-result:
    name: Publish issue policy result
    needs: [issue-link-pending, issue-link]
    if: ${{ always() }}
    permissions:
      statuses: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          VALIDATION_RESULT: ${{ needs.issue-link.result }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            const unchanged = current.state === 'open' && current.head.sha === pr.head.sha &&
              current.base.ref === pr.base.ref && current.body === pr.body;
            const passed = process.env.VALIDATION_RESULT === 'success' && unchanged;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: 'issue-link', state: passed ? 'success' : 'failure',
              description: passed ? 'Issue-closing policy passed.' : 'Issue-closing policy failed; inspect this run.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
