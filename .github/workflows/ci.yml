name: Source checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Python and JavaScript syntax
        run: |
          python -c 'from pathlib import Path; files=list(Path(".").rglob("*.py")); [compile(p.read_bytes(),str(p),"exec") for p in files]; print(f"Parsed {len(files)} Python files")'
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend tests/browser -type f \( -name '*.mjs' -o -name '*.js' \) -print0)
      - name: Secret scan (pinned binary, exact reviewed false-positive exclusions)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Legacy test-path compatibility on disposable hosted runner only
        run: |
          sudo mkdir -p /usr/local/lib/hermes-agent /home/lindayi/.hermes/node/bin
          sudo ln -s "$GITHUB_WORKSPACE/node_modules" /usr/local/lib/hermes-agent/node_modules
          sudo ln -s "$GITHUB_WORKSPACE/package.json" /usr/local/lib/hermes-agent/package.json
          sudo ln -s "$(command -v node)" /home/lindayi/.hermes/node/bin/node
      - name: Managed JavaScript unit suite
        run: HERMES_TEST_PYTHON="$(command -v python)" python scripts/test.py js
