name: Source checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Python and JavaScript syntax
        run: |
          python -c 'from pathlib import Path; files=list(Path(".").rglob("*.py")); [compile(p.read_bytes(),str(p),"exec") for p in files]; print(f"Parsed {len(files)} Python files")'
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend tests/browser -type f \( -name '*.mjs' -o -name '*.js' \) -print0)
      - name: Secret scan
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-environment
        with:
          browser: 'true'
      - run: python -B scripts/ci_tests.py js
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-environment
        with:
          browser: 'true'
      - run: python -B scripts/ci_tests.py --shard ${{ matrix.shard }} --shards 2 python
      - name: Bounded synthetic failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-${{ matrix.shard }}-${{ github.run_attempt }}
          path: /tmp/hmt-*/r-*/run.log
          retention-days: 3
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-environment
        with:
          browser: 'true'
      - name: Build exact generated assets
        run: python -B -c 'import os; from pathlib import Path; from deploy.frontend_release import build_frontend; build_frontend(Path("frontend").absolute(), Path(os.environ["RUNNER_TEMP"])/"public")'
      - run: python -B scripts/ci_tests.py --assets "$RUNNER_TEMP/public" --shard ${{ matrix.shard }} --shards 4 browser
      - name: Bounded synthetic failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            /tmp/hmt-*/r-*/run.log
            /tmp/hmt-*/r-*/artifacts/*.png
            /tmp/hmt-*/r-*/artifacts/*.jpg
            /tmp/hmt-*/r-*/artifacts/*.webp
            /tmp/hmt-*/r-*/artifacts/*.log
          retention-days: 3
          if-no-files-found: ignore
  source-ci:
    if: ${{ always() }}
    needs: [checks, js, python, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every hosted suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          print(json.dumps(results, indent=2))
          sys.exit(bool(failed) or set(results) != {'checks','js','python','browser'})
          PY
