name: Isolated test dependencies
description: Reproduce test dependencies on disposable GitHub-hosted Linux only
inputs:
  browser:
    description: Install pinned Chromium and Playwright ffmpeg
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.lock
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - shell: bash
      run: |
        python -m pip install -r requirements.lock
        npm ci --ignore-scripts --no-audit --no-fund
        # Only disposable hosted runners receive these legacy path shims.
        test "$GITHUB_ACTIONS" = true
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo mkdir -p /usr/local/lib/hermes-agent /home/lindayi/.hermes/node/bin
        sudo ln -s "$GITHUB_WORKSPACE/node_modules" /usr/local/lib/hermes-agent/node_modules
        sudo ln -s "$GITHUB_WORKSPACE/package.json" /usr/local/lib/hermes-agent/package.json
        sudo ln -s "$(command -v node)" /home/lindayi/.hermes/node/bin/node
        printf 'HERMES_TEST_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
    - if: ${{ inputs.browser == 'true' }}
      shell: bash
      run: |
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
        ./node_modules/.bin/playwright install --with-deps chromium
        browser=$(node -p "require('playwright').chromium.executablePath()")
        test -x "$browser"
        printf 'PLAYWRIGHT_BROWSERS_PATH=%s\nHERMES_BROWSER=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" "$browser" >> "$GITHUB_ENV"
        # Two legacy fixtures use this exact path. Never run this on production.
        sudo ln -sf "$browser" /usr/bin/google-chrome
        node --version
        "$browser" --version
