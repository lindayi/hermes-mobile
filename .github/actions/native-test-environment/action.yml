name: Pinned native Hermes test runtime
description: Prepare the public patched Hermes runtime on disposable hosted Ubuntu only
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      run: |
        test "$GITHUB_ACTIONS" = true
        test "$RUNNER_ENVIRONMENT" = github-hosted
        python -c 'import os; from scripts.prepare_native_test_runtime import validate_hosted_runner; validate_hosted_runner(os.environ)'
        sudo install -d --mode=0755 --owner="$(id -u)" --group="$(id -g)" /usr/local/lib/hermes-agent
        python scripts/prepare_native_test_runtime.py
