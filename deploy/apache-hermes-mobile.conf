# Include INSIDE the existing lindayi.me HTTPS VirtualHost only.
# Reuses that vhost certificate. Requires proxy, proxy_http, headers modules.
# Install only after review and auth/security acceptance, then apachectl configtest.
RedirectMatch 302 ^/hermes$ /hermes/
ProxyPass /hermes/app-api/ http://127.0.0.1:9120/hermes/app-api/ retry=0 timeout=300
ProxyPassReverse /hermes/app-api/ http://127.0.0.1:9120/hermes/app-api/
<Directory /var/www/html/hermes>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    <FilesMatch "\.(py|sqlite|db|jsonl|env|pem|key|log)$">
        Require all denied
    </FilesMatch>
</Directory>
<Location /hermes/>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
</Location>
<Location /hermes/app-api/>
    Header always set Cache-Control "no-store"
    RequestHeader set X-Forwarded-Proto "https"
</Location>
